<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Africa Nighttime Lights Atlas – Country Reports</title>
<style>
  :root{
    --bg:#f7faf9;
    --card:#ffffff;
    --ink:#0f2222;
    --muted:#637b7b;
    --accent:#0BA37F;           /* AfDB green vibe */
    --accent-2:#0f8e6e;
    --chip:#e7f4f0;
    --ring:#dfe9e6;
  }
  *{box-sizing:border-box}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family: system-ui,-apple-system,Segoe UI,Roboto,Ubuntu,Cantarell,"Helvetica Neue",Arial,"Noto Sans",sans-serif;
  }
  header{
    position:sticky; top:0; z-index:10;
    background:linear-gradient(180deg,#fff 0%, #fff8 85%, transparent);
    backdrop-filter: blur(6px);
    border-bottom:1px solid #eef3f1;
  }
  .wrap{max-width:1200px; margin:0 auto; padding:18px 20px;}
  .hero{
    display:flex; align-items:center; gap:14px; flex-wrap:wrap;
  }
  .hero .brand{
    display:flex; align-items:center; gap:10px;
  }
  .brand img{height:38px; width:auto; filter: drop-shadow(0 0 0 rgba(0,0,0,0.0));}
  h1{font-size:clamp(20px,3vw,28px); margin:0; font-weight:800; letter-spacing:.2px}
  .subtitle{color:var(--muted); margin-top:2px; font-size:14px}
  .cta{
    margin-left:auto; display:flex; gap:10px; flex-wrap:wrap;
  }
  .btn{
    background: var(--accent);
    color:#fff; text-decoration:none; font-weight:600; font-size:14px;
    padding:10px 14px; border-radius:10px; border:1px solid #08906f;
    box-shadow: 0 1px 0 #0a7a60 inset, 0 2px 8px rgba(0,0,0,.06);
    display:inline-flex; align-items:center; gap:8px;
  }
  .btn:hover{background:var(--accent-2)}
  .toolbar{
    margin-top:14px; display:flex; gap:10px; flex-wrap:wrap; align-items:center;
  }
  .search{
    flex:1 1 320px; position:relative;
  }
  .search input{
    width:100%; padding:12px 14px 12px 40px; border-radius:12px; border:1px solid var(--ring);
    outline:none; background:#fff; color:var(--ink); font-size:15px;
    box-shadow: 0 1px 0 #fff inset, 0 1px 6px rgba(16,36,36,.04);
  }
  .search svg{position:absolute; left:12px; top:50%; transform:translateY(-50%); opacity:.55}
  .az{display:flex; flex-wrap:wrap; gap:6px}
  .chip{
    padding:8px 10px; font-size:13px; border-radius:999px; color:#0d3a31; background:var(--chip);
    border:1px solid var(--ring); cursor:pointer; user-select:none;
  }
  .chip.active{background:var(--accent); color:#fff; border-color:#0a7a60}

  main{max-width:1200px; margin:12px auto 60px; padding:0 20px;}
  .grid{
    display:grid;
    grid-template-columns: repeat(auto-fill,minmax(220px,1fr));
    gap:16px;
  }
  .card{
    background:var(--card); border:1px solid var(--ring); border-radius:16px;
    overflow:hidden; box-shadow: 0 2px 10px rgba(0,0,0,.04);
    transition:.2s transform ease, .2s box-shadow ease;
  }
  .card:hover{transform: translateY(-2px); box-shadow: 0 8px 22px rgba(0,0,0,.08)}
  .flag{
    width:100%; height:120px; display:flex; align-items:center; justify-content:center; background:#f2f5f4;
    border-bottom:1px solid var(--ring);
  }
  .flag img{max-height:90px; width:auto; object-fit:contain}
  .meta{padding:12px 14px}
  .name{font-weight:800; font-size:16px; margin:0 0 2px}
  .iso{color:var(--muted); font-size:12px; letter-spacing:.4px}
  .link{
    display:block; margin:10px 14px 14px; text-decoration:none; text-align:center;
    background:#0f6652; color:#fff; padding:9px 10px; border-radius:10px; font-weight:700; font-size:14px;
    border:1px solid #0b5443;
  }
  .link:hover{background:#0d5948}
  footer{max-width:1200px; margin:30px auto 50px; padding:0 20px; color:var(--muted); font-size:13px}
</style>
</head>
<body>

<header>
  <div class="wrap">
    <div class="hero">
      <div class="brand">
        <!-- Put your AfDB logo in the same folder or adjust the path -->
        <img src="Logo_Afrikanische_Entwicklungsbank.svg.png" alt="AfDB" onerror="this.style.display='none'">
        <div>
          <h1>Africa Nighttime Lights Atlas</h1>
          <div class="subtitle">2012–2024 Edition · Country PDF Reports</div>
        </div>
      </div>
      <div class="cta">
        <!-- If you produce a merged atlas, name it like this or change the href -->
        <a class="btn" href="NTL_Africa_Atlas_merged.pdf" target="_blank" title="Open merged atlas">
          📘 Merged Atlas
        </a>
      </div>
    </div>

    <div class="toolbar">
      <div class="search">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M21 21l-4.3-4.3m2.3-5.2a7.5 7.5 0 11-15 0 7.5 7.5 0 0115 0z" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <input id="q" type="search" placeholder="Search by country or ISO (e.g., Kenya, KEN)…" />
      </div>
      <div class="az" id="az"></div>
    </div>
  </div>
</header>

<main>
  <div id="grid" class="grid" aria-live="polite"></div>
</main>

<footer>
  Built for offline use. Make sure your files follow the pattern:
  <code>https://github.com/Data-Innovation-For-Africa/Data-Innovation-For-Africa.github.io/tree/master/Insights/NTL_&lt;ISO3&gt;_Atlas.pdf</code> and <code>flags/&lt;ISO3&gt;.png</code>.
</footer>

<script>
  // --------- CONFIGURE YOUR FOLDERS HERE ----------
  const PDF_DIR   = "https://github.com/Data-Innovation-For-Africa/Data-Innovation-For-Africa.github.io/tree/master/Insights";   // where your per-country PDFs live
  const FLAG_DIR  = "https://github.com/Data-Innovation-For-Africa/Data-Innovation-For-Africa.github.io/tree/master/flags";      // where flags live
  // ------------------------------------------------

  // Minimal but complete list (ISO3 -> Name). Edit as needed.
  // You can paste your own mapping or generate it from african_countries.txt.
  const COUNTRIES = [
    ["AGO","Angola"],["BDI","Burundi"],["BEN","Benin"],["BFA","Burkina Faso"],["BWA","Botswana"],
    ["CAF","Central African Republic"],["CIV","Côte d’Ivoire"],["CMR","Cameroon"],["COD","Congo, Dem. Rep."],
    ["COG","Congo, Rep."],["COM","Comoros"],["CPV","Cabo Verde"],["DJI","Djibouti"],["DZA","Algeria"],
    ["EGY","Egypt"],["ERI","Eritrea"],["ESH","Western Sahara"],["ETH","Ethiopia"],["GAB","Gabon"],
    ["GHA","Ghana"],["GIN","Guinea"],["GMB","Gambia"],["GNB","Guinea-Bissau"],["GNQ","Equatorial Guinea"],
    ["KEN","Kenya"],["LBR","Liberia"],["LBY","Libya"],["LSO","Lesotho"],["MAR","Morocco"],["MDG","Madagascar"],
    ["MLI","Mali"],["MOZ","Mozambique"],["MRT","Mauritania"],["MWI","Malawi"],["NAM","Namibia"],
    ["NER","Niger"],["NGA","Nigeria"],["RWA","Rwanda"],["SDN","Sudan"],["SEN","Senegal"],["SLE","Sierra Leone"],
    ["SOM","Somalia"],["SSD","South Sudan"],["STP","São Tomé and Príncipe"],["SWZ","Eswatini"],
    ["SYC","Seychelles"],["TCD","Chad"],["TGO","Togo"],["TUN","Tunisia"],["TZA","Tanzania"],
    ["UGA","Uganda"],["ZAF","South Africa"],["ZMB","Zambia"],["ZWE","Zimbabwe"],
  ];

  // Sort A→Z by name
  COUNTRIES.sort((a,b)=>a[1].localeCompare(b[1],'en',{sensitivity:'base'}));

  const grid = document.getElementById('grid');
  const q = document.getElementById('q');

  function cardHTML(iso, name){
    const pdf = `${PDF_DIR}/NTL_${iso}_Atlas.pdf`;
    const flag = `${FLAG_DIR}/${iso}.png`;
    return `
      <article class="card" data-name="${name.toLowerCase()}" data-iso="${iso}">
        <div class="flag">
          <img src="${flag}" alt="${name} flag" onerror="this.style.display='none'">
        </div>
        <div class="meta">
          <h3 class="name">${name}</h3>
          <div class="iso">ISO3: ${iso}</div>
        </div>
        <a class="link" href="${pdf}" target="_blank" title="Open ${name} report">Open report</a>
      </article>
    `;
  }

  function render(list){
    grid.innerHTML = list.map(([iso,name])=>cardHTML(iso,name)).join('');
  }

  // Initial render
  render(COUNTRIES);

  // Search
  q.addEventListener('input', ()=>{
    const s = q.value.trim().toLowerCase();
    const filtered = COUNTRIES.filter(([iso,name])=>
      iso.toLowerCase().includes(s) || name.toLowerCase().includes(s)
    );
    render(filtered);
  });

  // A–Z filter chips
  const az = document.getElementById('az');
  const letters = [..."ABCDEFGHIJKLMNOPQRSTUVWXYZ"];
  let activeLetter = null;

  function drawChips(){
    az.innerHTML = `
      <span class="chip ${activeLetter===null?'active':''}" data-letter="">All</span>
      ${letters.map(L=>`<span class="chip ${activeLetter===L?'active':''}" data-letter="${L}">${L}</span>`).join('')}
    `;
    az.querySelectorAll('.chip').forEach(ch=>{
      ch.addEventListener('click', ()=>{
        activeLetter = ch.dataset.letter || null;
        az.querySelectorAll('.chip').forEach(x=>x.classList.remove('active'));
        ch.classList.add('active');
        filterByLetter();
      });
    });
  }
  function filterByLetter(){
    const s = q.value.trim().toLowerCase();
    let rows = COUNTRIES;
    if(activeLetter){
      rows = rows.filter(([iso,name])=>name.toUpperCase().startsWith(activeLetter));
    }
    if(s){
      rows = rows.filter(([iso,name])=>
        iso.toLowerCase().includes(s) || name.toLowerCase().includes(s)
      );
    }
    render(rows);
  }
  drawChips();
</script>

</body>
</html>
